{% extends "base.html" %}

{% block title %}Edit Item{% endblock %}

{% block content %}
    <div class="container">
        <h2 class="mb-4">Edit Item</h2>

        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Item Name</label>
                            <input type="text" name="item_name"
                            value="{{ item.Item_Name }}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Item Type</label>
                            <input type="text" name="item_type"
                                value="{{ item.Item_Type or '' }}" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Obtained From</label>
                            <input type="text" name="obtained_from"
                                value="{{ item.Item_Obtained_From or '' }}" class="form-control">
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary me-2">Save Changes</button>
                        <a href="{{ url_for('items_list') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
