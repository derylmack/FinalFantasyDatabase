{% extends "base.html" %}

{% block title %}Edit {% endblock %}

{% block content %}
    <h2>Edit Item</h2>
    <div class="card">
        <form method="POST">
            <div class="form-group">
                <label>Item Name</label>
                <input type="text" name="item_name" value="{{ item.Item_Name }}" required>
            </div>
            <div class="form-group">
                <label>Item Type</label>
                <input type="text" name="item_type" value="{{ item.Item_Type or '' }}">
            </div>
            <div class="form-group">
                <label>Obtained From</label>
                <input type="text" name="obtained_from" value="{{ item.Item_Obtained_From or '' }}">
            </div>
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="{{ url_for('items_list') }}" class="btn-secondary">Cancel</a>
        </form>
    </div>
{% endblock %}
